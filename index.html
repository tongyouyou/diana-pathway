<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Diana's Pathway</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <button class="header-icon-btn" data-action="toggle-sidebar" title="收起 / 展开导航">☰</button>
        <div class="brand-text">
          <strong>Diana's Pathway</strong>
        </div>
      </div>
      <div class="header-right" id="headerRight"></div>
    </header>

    <div class="app-body">
      <nav class="sidebar" id="tabbar">
        <button class="tab is-active" data-nav="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
          <span>控制台</span>
        </button>
        <button class="tab" data-nav="schedule">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <span>课表信息</span>
        </button>
        <button class="tab" data-nav="record">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4.5 4.5V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v4.5h4.5M8.5 12.5h7M8.5 16.5h4.5"/></svg>
          <span>销课记录</span>
        </button>
        <button class="tab" data-nav="library">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H8a2 2 0 0 1 2 2v13a1.6 1.6 0 0 0-1.6-1.4H4V5.5Z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H16a2 2 0 0 0-2 2v13a1.6 1.6 0 0 1 1.6-1.4H20V5.5Z"/></svg>
          <span>词库信息</span>
        </button>
        <button class="tab" data-action="toggle-supervise" data-nav-parent="supervise">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="M6 10.2V15c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.8"/></svg>
          <span>督学管理</span>
        </button>
        <div class="nav-sub" id="navSubSupervise">
          <button class="tab is-sub" data-nav="review">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4.5v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 19.5v-4h4"/></svg>
            <span>抗遗忘</span>
          </button>
        </div>
        <button class="tab" data-nav="students">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16.5 5.4a3.4 3.4 0 0 1 0 6.6M17.6 20a6.3 6.3 0 0 0-1.6-4.2"/></svg>
          <span>学员管理</span>
        </button>
        <button class="tab" data-nav="coaches">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.4"/><path d="M3.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16.6 11.4l1.9 1.9 3.4-3.4"/></svg>
          <span>教练管理</span>
        </button>
        <button class="tab" data-nav="me">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
          <span>用户信息</span>
        </button>
      </nav>
      <main class="view" id="view"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>
  <div id="printArea"></div>

  <script src="data-seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
